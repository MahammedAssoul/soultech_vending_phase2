name: soultech_vending
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  fl_chart: ^0.70.2
  intl: ^0.20.2
  sqflite: ^2.4.1
  path: ^1.9.0
  go_router: ^14.8.1
  shared_preferences: ^2.5.3
  pdf: ^3.11.0
  printing: ^5.13.0
  excel: ^4.0.6
  path_provider: ^2.1.4
  share_plus: ^10.1.2
  file_selector: ^1.0.3

  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.1
  sqflite_common_ffi: ^2.4.2+1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/soultech_logo.svg
    - assets/branding/soultech_logo.png
    - assets/branding/soultech_main_logo.png
    - assets/branding/appbar_icon.svg
    - assets/data/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/soultech_main_logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/soultech_main_logo.png

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/branding/soultech_main_logo.png
  android: true
  ios: true
  android_12:
    color: "#FFFFFF"
    image: assets/branding/soultech_main_logo.png
